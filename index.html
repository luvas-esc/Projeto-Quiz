<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <script type="module" src="./quiz.js"></script>
    <script type="module" src="./hortaDOM.js"></script>


    <title>Quiz</title>
</head>


<body>

<h1 id="tituloQuiz"> Hortus Studiorum </h1>

<div id="container-pagina">

    <div class = "quiz-container">


        <div id="colunaEsq">
            
            
            <div id="temaPerguntas">
                <label>Escolha um tema:</label>
                <select id="areaConhecimento">
                    <option value="Todos">Todos</option>
                    <option value="Sociologia">Sociologia</option>
                    <option value="Química">Química</option>
                    <option value="Biologia">Biologia</option>
                </select>
            </div>

            <p id="fontePergunta"> Fonte da Pergunta</p>

            <p id="id_pergunta">Id: </p>

            <div id="enunciadoPergunta"> 
                
                Enunciado da pergunta
                
                segundo paragrafo 

                e terceiro paragrafo

            </div>

            <div id="imagem_container"><img id="imagem" src=""> </img></div>

            <ul id="alternativas"> 
                <button id="alternativa1" >Alternativa 1</button>
                <button id="alternativa2" >Alternativa 2</button>
                <button id="alternativa3" >Alternativa 3</button>
                <button id="alternativa4" >Alternativa 4</button>
                <button id="alternativa5" >Alternativa 5</button>
            </ul>

            <div id="botaoProxima"></div>

        </div>

        <div id="colunaDir">   
            <div id="infosUsuario">
                <p id="respondidas">Questões Respondidas: 0</p>
                <p id="acertos">Quantidade de Acertos: 0</p>
                
                <div id="horta-container">
    
                    <div id="hortaDOM"></div>

                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
